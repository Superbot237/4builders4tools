<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anarchy Server Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-p-6">
    <div class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center border-b border-zinc-800 pb-4 mb-6">
            <h1 class="text-2xl font-black tracking-wider text-red-500">ANARCHY // OPS</h1>
            <span id="status-badge" class="px-3 py-1 bg-emerald-950 text-emerald-400 text-xs font-bold rounded border border-emerald-800">CONNECTING...</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">
                <p class="text-xs text-zinc-400 uppercase font-bold">Players Online</p>
                <p id="players" class="text-3xl font-bold mt-1 text-zinc-100">-</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">
                <p class="text-xs text-zinc-400 uppercase font-bold">Server TPS</p>
                <p id="tps" class="text-3xl font-bold mt-1 text-zinc-100">-</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">
                <p class="text-xs text-zinc-400 uppercase font-bold">World Storage Used</p>
                <p id="storage" class="text-3xl font-bold mt-1 text-red-400">-</p>
            </div>
        </div>

        <!-- Storage Progress Bar tracking towards 1TB -->
        <div class="bg-zinc-900 p-5 rounded-lg border border-zinc-800 mb-6">
            <div class="flex justify-between text-sm mb-2 font-medium">
                <span>Storage Progression (Target: 1 TB)</span>
                <span id="storage-text">0 GB / 1000 GB</span>
            </div>
            <div class="w-full bg-zinc-800 h-4 rounded-overflow overflow-hidden">
                <div id="storage-bar" class="bg-red-600 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/server-stats');
                const data = await response.json();
                
                document.getElementById('players').innerText = data.playersOnline;
                document.getElementById('tps').innerText = data.tps;
                document.getElementById('storage').innerText = data.worldSizeGB + ' GB';
                
                const percentage = Math.min((data.worldSizeGB / data.maxStorageGB) * 100, 100);
                document.getElementById('storage-bar').style.width = percentage + '%';
                document.getElementById('storage-text').innerText = `${data.worldSizeGB} GB / ${data.maxStorageGB} GB (${percentage.toFixed(2)}%)`;
                
                const badge = document.getElementById('status-badge');
                badge.innerText = data.status.toUpperCase();
                badge.className = "px-3 py-1 bg-emerald-950 text-emerald-400 text-xs font-bold rounded border border-emerald-800";
            } catch (err) {
                document.getElementById('status-badge').innerText = "OFFLINE";
                document.getElementById('status-badge').className = "px-3 py-1 bg-red-950 text-red-400 text-xs font-bold rounded border border-red-800";
            }
        }

        fetchStats();
        setInterval(fetchStats, 5000); // Refresh every 5 seconds
    </script>
</body>
</html>
