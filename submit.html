<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Server // 4B4T</title>
  <style>
    :root {
      --bg: #05080d;
      --bg-soft: #0d1520;
      --line: rgba(255,255,255,0.08);
      --text: #edf6ff;
      --muted: #9aa9bb;
      --blue: #4a8dff;
      --blue-soft: #7fc7ff;
      --green: #55d98a;
      --red: #ff4d4d;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(74,141,255,0.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(255,77,77,0.15), transparent 24%),
        linear-gradient(180deg, #04070b 0%, #09111a 100%);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .shell {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 4rem 0;
    }

    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 2rem 1.4rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.07em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    .field {
      display: grid;
      gap: 0.45rem;
    }

    label {
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--line);
      background: rgba(5,8,13,0.75);
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 0.9rem 1rem;
      border: 1px solid rgba(74, 141, 255, 0.35);
      background: rgba(74, 141, 255, 0.12);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .status {
      min-height: 1.2rem;
      color: var(--green);
      font-size: 0.85rem;
    }

    .status.error {
      color: var(--red);
    }

    .nav-row {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-row a,
    .nav-row button {
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      text-decoration: none;
      padding: 0.7rem 0.9rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <h1>Submit your server</h1>
      <p class="subtitle">Logged-in users can submit a server for approval. The site owner decides whether it appears on the live ranked list.</p>

      <form id="submit-server-form">
        <div class="field">
          <label for="server-name">Server name</label>
          <input id="server-name" name="serverName" type="text" placeholder="Example: My Server" required />
        </div>

        <div class="field">
          <label for="server-ip">Server IP</label>
          <input id="server-ip" name="serverIp" type="text" placeholder="play.example.com" required />
        </div>

        <div id="submit-status" class="status" aria-live="polite"></div>
        <button type="submit">Submit</button>
      </form>

      <div class="nav-row">
        <a href="servers.html">Back to monitor</a>
        <button id="logout-button" type="button">Logout</button>
      </div>
    </section>
  </main>

  <script>
    const APPROVED_KEY = 'anarchy-approved-servers';
    const SUBMIT_KEY = 'anarchy-pending-servers';

    function isLoggedIn() {
      return localStorage.getItem('anarchyLoggedIn') === 'true';
    }

    function ensureLoggedIn() {
      if (!isLoggedIn()) {
        window.location.href = 'login.html';
      }
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return `server-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function savePending(submissions) {
      localStorage.setItem(SUBMIT_KEY, JSON.stringify(submissions));
    }

    function getPending() {
      try {
        return JSON.parse(localStorage.getItem(SUBMIT_KEY) || '[]');
      } catch (err) {
        return [];
      }
    }

    function getApprovedServers() {
      try {
        return JSON.parse(localStorage.getItem(APPROVED_KEY) || '[]');
      } catch (err) {
        return [];
      }
    }

    document.getElementById('logout-button').addEventListener('click', () => {
      localStorage.setItem('anarchyLoggedIn', 'false');
      localStorage.setItem('anarchyUser', '');
      window.location.href = 'login.html';
    });

    document.getElementById('submit-server-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const status = document.getElementById('submit-status');
      const name = document.getElementById('server-name').value.trim();
      const ip = document.getElementById('server-ip').value.trim();

      if (!name || !ip) {
        status.textContent = 'Please fill in both fields.';
        status.classList.add('error');
        return;
      }

      const pending = getPending();
      const approved = getApprovedServers();
      const alreadyApproved = approved.some((server) => server.ip.toLowerCase() === ip.toLowerCase());
      const alreadyPending = pending.some((server) => server.ip.toLowerCase() === ip.toLowerCase());

      if (alreadyApproved || alreadyPending) {
        status.textContent = 'That server is already in the system.';
        status.classList.add('error');
        return;
      }

      pending.push({
        id: makeId(),
        name,
        ip,
        approved: false,
        isHome: false,
        online: 0,
        max: 0,
        status: 'offline'
      });

      savePending(pending);
      status.textContent = 'Server submitted. Awaiting approval.';
      status.classList.remove('error');
      event.currentTarget.reset();
    });

    ensureLoggedIn();
  </script>
</body>
</html>
