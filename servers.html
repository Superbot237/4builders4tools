<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Anarchy Monitor // 4B4T</title>
  <style>
    :root {
      --bg: #05080d;
      --bg-soft: #0d1520;
      --panel: rgba(14, 18, 25, 0.88);
      --line: rgba(255,255,255,0.08);
      --text: #edf6ff;
      --muted: #9aa9bb;
      --blue: #4a8dff;
      --blue-soft: #7fc7ff;
      --red: #ff4d4d;
      --red-soft: #ff7a7a;
      --green: #55d98a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(74,141,255,0.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(255,77,77,0.15), transparent 24%),
        linear-gradient(180deg, #04070b 0%, #09111a 100%);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      background: rgba(5, 8, 13, 0.72);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.15rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand span { color: var(--blue-soft); }

    .nav {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 0.7rem;
      font-weight: 800;
      transition: color 0.2s ease;
    }

    .nav a:hover, .nav a.active { color: var(--text); }

    .page-header {
      padding: 3rem 0 2rem;
    }

    .page-header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      max-width: 600px;
      line-height: 1.6;
    }

    .network-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .network-card {
      padding: 1.4rem 1.2rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.015);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
    }

    .network-card.highlight-card {
      border-color: rgba(74, 141, 255, 0.4);
      background: linear-gradient(180deg, rgba(74, 141, 255, 0.05), rgba(255, 255, 255, 0.01));
    }

    .network-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .network-name-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }

    .network-rank {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      background: rgba(74, 141, 255, 0.12);
      border: 1px solid rgba(74, 141, 255, 0.35);
      color: var(--blue-soft);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .network-name {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .network-badge {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.25rem 0.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 800;
    }

    .network-badge.home {
      background: rgba(85,217,138,0.1);
      border-color: rgba(85,217,138,0.3);
      color: var(--green);
    }

    .network-details {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .network-ip-text {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: monospace;
    }

    .network-players {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    @media (max-width: 900px) {
      .network-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 640px) {
      .network-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">4B4T <span>// ANARCHY</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="servers.html" class="active">Global Monitor</a>
        <a href="https://discord.gg/NqdBJBMNv" target="_blank" rel="noreferrer">Discord</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <div class="page-header">
      <h1>Global Anarchy Monitor</h1>
      <p>Tracking live playercounts across every primary legacy, classic, and community anarchy server on the web.</p>
    </div>

    <div class="network-grid" id="network-servers-container"></div>
  </main>

  <script>
    const anarchyServers = [
      { name: "4B4T (You)", ip: "4b4t.loca.lol", isHome: true, online: 0, max: 0, status: 'offline' },
      { name: "2B2T", ip: "2b2t.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "0B0T", ip: "0b0t.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "1B1T", ip: "1b1t.fyi", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "3B3T", ip: "3b3t.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "9b9t", ip: "9b9t.com", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "6B6T", ip: "join.6b6t.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Minewind", ip: "morbius.minewind.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Anarchy.ae", ip: "anarchy.ae", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "LegendaryHardcore", ip: "mc.legendaryhc.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Hardcore Vanilla", ip: "hardcore.vanillamcserver.com", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "HaZey Anarchy", ip: "msorg.HaZeyNetwork.com", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Anarchy.ac", ip: "anarchy.ac", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Purity Vanilla", ip: "mc.purityvanilla.com", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "8builders8tools", ip: "8b8t.me", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "VanillaPlus", ip: "play.vanillaplus.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Gladius", ip: "play.gladiusmc.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "FKAS Survival", ip: "fkas.online", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "AuroraMC", ip: "jogar.auroramc.com.br", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "y64", ip: "y64.org", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Arda Anarchy", ip: "ardaanarchy.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "UneasyVanilla", ip: "UneasyVanilla.com", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "2b2u", ip: "msorg.2b2u.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "Just Another Hardcore", ip: "justanotherhardcore.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "VanguardHardcore", ip: "play.vanguarde.fun", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "SimPvP", ip: "simpvp.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "2f2f", ip: "0b0t.us", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "7b7t", ip: "7b7t.net", isHome: false, online: 0, max: 0, status: 'offline' },
      { name: "oldfag", ip: "oldfrog.org", isHome: false, online: 0, max: 0, status: 'offline' }
    ];

    function getActiveServerList() {
      return [...anarchyServers];
    }

    function renderServers() {
      const container = document.getElementById('network-servers-container');
      const rankedServers = getActiveServerList()
        .sort((a, b) => {
          if (b.online !== a.online) return b.online - a.online;
          return a.name.localeCompare(b.name);
        })
        .map((server, index) => ({ ...server, rank: index + 1 }));

      container.innerHTML = rankedServers.map((server) => {
        const playerText = server.status === 'online'
          ? `${server.online}${server.max ? ` / ${server.max}` : ''}`
          : 'Offline';
        const playerColor = server.status === 'online' ? 'var(--text)' : 'var(--red-soft)';

        return `
          <article class="network-card ${server.isHome ? 'highlight-card' : ''}">
            <div class="network-header">
              <div class="network-name-wrap">
                <span class="network-rank">#${server.rank}</span>
                <span class="network-name">${server.name}</span>
              </div>
              <span class="network-badge ${server.isHome ? 'home' : ''}">${server.isHome ? 'Home Server' : 'Anarchy'}</span>
            </div>
            <div class="network-details">
              <span class="network-ip-text">${server.ip}</span>
              <span class="network-players" style="color: ${playerColor}">${playerText}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    async function updateNetworkStatus() {
      const allServers = getActiveServerList();
      await Promise.all(allServers.map(async (server) => {
        try {
          const res = await fetch(`https://api.mcsrvstat.us/3/${server.ip}`);
          const info = await res.json();

          if (info.online) {
            server.online = Number(info.players?.online ?? 0);
            server.max = Number(info.players?.max ?? 0);
            server.status = 'online';
          } else {
            server.online = 0;
            server.max = 0;
            server.status = 'offline';
          }
        } catch (err) {
          server.online = 0;
          server.max = 0;
          server.status = 'offline';
        }
      }));

      renderServers();
    }

    renderServers();
    updateNetworkStatus();
    setInterval(updateNetworkStatus, 60000);
  </script>
</body>
</html>
